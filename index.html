<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#a855f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background-color:#ffeef5;background-image:radial-gradient(circle,#ffd3e6 1.5px,transparent 1.5px),radial-gradient(circle,#ffe4f0 1.5px,transparent 1.5px);background-size:22px 22px;background-position:0 0,11px 11px;color:#b0567f;padding:16px 10px 76px;min-height:100vh;-webkit-tap-highlight-color:transparent}
.container{max-width:960px;margin:0 auto}
/* 顶部标题区 */
.hero{margin-bottom:14px;text-align:center;position:relative}
.hero-bow{font-size:1.3rem;letter-spacing:2px}
.hero-title{font-size:1.5rem;font-weight:800;color:#f9a8d4;text-shadow:1px 1px 0 #fff,2px 2px 0 #ffd3e6;margin-bottom:2px}
.hero-date{color:#d48aa9;font-size:.78rem;margin-bottom:10px}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.h-stat{background:#fff;border-radius:18px;padding:11px 6px;text-align:center;cursor:pointer;box-shadow:0 4px 14px rgba(244,114,182,.15);border:2px solid #ffe4f0;transition:transform .12s}
.h-stat:active{transform:scale(.96)}
.hs-n{font-size:1.1rem;font-weight:800;color:#f9a8d4}
.hs-l{font-size:.64rem;color:#d48aa9;margin-top:2px}
h1{font-size:1.25rem;background:linear-gradient(135deg,#ec4899,#a855f7,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px}
.subtitle{color:#d48aa9;font-size:.78rem;margin-bottom:14px}
.card{background:#fff;border-radius:20px;padding:15px;box-shadow:0 4px 18px rgba(244,114,182,.15);margin-bottom:12px;border:2px solid #ffe4f0}
.card-title{font-size:.92rem;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:#f9a8d4}
textarea,.field{width:100%;padding:10px 12px;border:2px solid #ffe4f0;border-radius:14px;font-size:.85rem;outline:none;font-family:inherit;background:#fffafc}
textarea:focus,.field:focus{border-color:#f9a8d4;box-shadow:0 0 0 3px #ffe4f0}
textarea{min-height:120px;line-height:1.5;resize:vertical}
.row{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.btn{padding:8px 18px;border-radius:12px;border:none;font-weight:600;cursor:pointer;font-size:.82rem;transition:opacity .15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,#f9a8d4,#fb7185);color:#fff;box-shadow:0 3px 12px rgba(251,113,133,.25)}
.btn-primary:hover:not(:disabled){background:linear-gradient(135deg,#fb7185,#fb7185);box-shadow:0 4px 16px rgba(251,113,133,.3)}
.btn-outline{background:#fff;border:2px solid #ffe4f0;color:#f9a8d4}
.btn-outline:hover{background:#fff0f7}
#status{font-size:.8rem;color:#d48aa9}
#status.loading{color:#f9a8d4}
#status.done{color:#fb7185}
#status.error{color:#ef4444}
table{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:4px}
thead{background:#fff0f7}
th{padding:5px;text-align:left;font-weight:700;white-space:nowrap;border-bottom:2px solid #ffe4f0;color:#f9a8d4}
td{padding:5px;border-bottom:1px solid #ffe4f0}
tr:hover td{background:#fff7fb}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px;margin-bottom:10px}
.s-card{text-align:center;padding:9px;border-radius:16px;background:#fff;box-shadow:0 3px 12px rgba(244,114,182,.12);border:1px solid #ffe4f0}
.s-card .n{font-size:1.1rem;font-weight:800}
.s-card .l{font-size:.68rem;color:#d48aa9;margin-top:2px}
.blue .n{color:#f9a8d4}.green .n{color:#fb7185}.amber .n{color:#f59e0b}
.result-box{border:2px solid #f9a8d4;border-radius:20px;padding:12px 14px;margin-bottom:10px;background:linear-gradient(135deg,#fff0f7,#ffe4f0)}
.result-box .book-title{font-size:.95rem;font-weight:800;color:#fb7185}
.result-box .meta{font-size:.7rem;color:#d48aa9;margin-top:2px}
.empty-state{text-align:center;color:#e0a8c2;padding:20px;font-size:.82rem}
select{padding:5px 8px;border:2px solid #ffe4f0;border-radius:10px;font-size:.82rem;background:#fffafc;outline:none;color:#f9a8d4}

/* 折叠 */
.fold-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.fold-header .arrow{font-size:.75rem;color:#d48aa9;transition:transform .2s}
.fold-header .arrow.open{transform:rotate(90deg)}
.fold-body{max-height:0;overflow:hidden;transition:max-height .25s ease}
.fold-body.open{max-height:2000px}

/* 历史记录 */
.h-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:2px solid #ffe4f0;border-radius:14px;margin-top:6px;gap:6px;flex-wrap:wrap;background:#fffafc}
.h-item .info{flex:1;min-width:120px}
.h-item .name{font-weight:600;font-size:.82rem;color:#b0567f}
.h-item .meta{font-size:.7rem;color:#d48aa9;margin-top:2px}
.h-item .actions{display:flex;gap:4px}
.h-item .actions button{padding:5px 10px;border-radius:10px;border:none;cursor:pointer;font-size:.72rem;font-weight:600}
.btn-h-q{background:linear-gradient(135deg,#f9a8d4,#fb7185);color:#fff}
.btn-h-c{background:#f9a8d4;color:#fff}
.btn-h-d{background:transparent;border:2px solid #ffe4f0!important;color:#e0a8c2}

/* Cookie 条 */
#cookieBar{padding:8px 12px;border-radius:14px;cursor:pointer;display:none;margin-bottom:10px;font-size:.82rem;border:2px solid #ffe4f0}
#cookieBar.valid{border-color:#f9a8d4;background:#fff0f7}
#cookieBar.invalid{border-color:#fca5a5;background:#fef2f2}
#cookieBar.warning{border-color:#fde68a;background:#fffbeb}
.fail-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border:2px solid #fca5a5;border-radius:16px;font-size:.72rem;font-family:monospace;background:#fff;cursor:pointer;color:#fb7185}
.save-bar{display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:10px;padding:8px;background:#fff0f7;border:2px solid #f9a8d4;border-radius:14px;flex-wrap:wrap}
.save-bar input{max-width:200px;padding:5px 8px;border:2px solid #ffe4f0;border-radius:10px;font-size:.8rem;outline:none;background:#fffafc}
.btn-save{background:linear-gradient(135deg,#f9a8d4,#fb7185);color:#fff;padding:5px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:600;font-size:.8rem}
.pc-bar{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;background:#fff0f7;border:2px solid #ffe4f0;border-radius:14px;font-size:.8rem}

/* 底部导航 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:2px solid #ffe4f0;display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom,6px);z-index:100}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#d48aa9;font-size:.65rem;cursor:pointer;padding:4px 16px}
.bottom-nav button svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none}
.bottom-nav button:active{color:#f9a8d4}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:8px;font-size:.85rem;z-index:999;display:none;max-width:80vw;text-align:center;pointer-events:none}

/* 手机专用 */
@media(max-width:480px){
  body{padding:10px 8px 72px}
  .card{padding:10px;margin-bottom:8px}
  .result-box{padding:10px}
}
</style>

</head>
<body>
<div class="container">
  <!-- 顶部标题区 -->
  <div class="hero">
    <div class="hero-bow">🎀</div>
    <div class="hero-title">孔夫子查价</div>
    <div class="hero-date" id="heroDate"></div>
    <div style="font-size:.66rem;color:#f0a6c8;margin:-6px 0 8px" id="appVer">前端 v4.5 · 去掉总价显示</div>
    <div class="hero-stats">
      <div class="h-stat" onclick="scrollTo(0,0)"><div class="hs-n" id="statToday">0</div><div class="hs-l">今日查价</div></div>
      <div class="h-stat" onclick="showTrack()"><div class="hs-n">📦</div><div class="hs-l">快递追踪</div></div>
      <div class="h-stat" onclick="fold('hist')"><div class="hs-n" id="statHist">0</div><div class="hs-l">历史记录</div></div>
      <div class="h-stat" onclick="cleanupAddr()"><div class="hs-n">🧹</div><div class="hs-l">清理地址</div></div>
    </div>
  </div>

  <!-- 查价主操作区 -->
  <div class="card">
    <div class="card-title">📖 ISBN（每行一个）</div>
    <textarea id="inputArea" placeholder="每行一个书号&#10;如：9787108009821&#10;9787020002207"></textarea>
    <div class="row">
      <label style="font-size:.8rem;color:#9d8bb0">品相:</label>
      <select id="qualitySelect">
        <option value="">不限</option><option value="100~100">全新</option>
        <option value="95~100">九五品+</option><option value="90~100">九品+</option>
        <option value="85~100">八五品+</option>
      </select>
      <button class="btn btn-primary" id="btnQuery">🔍 查最低价</button>
      <button class="btn btn-outline" id="btnClear">清空</button>
      <span id="status">就绪</span>
    </div>
    <div style="margin-top:10px;padding:10px 12px;background:#fff0f7;border:2px dashed #f9a8d4;border-radius:12px">
      <div style="font-size:.8rem;color:#f472b6;font-weight:600;margin-bottom:6px">📮 收货地址（选填 · 自动按地址算运费）</div>
      <div style="display:flex;gap:6px">
        <input id="addrInput" type="text" placeholder="粘贴买家收货地址，如：刘齐倚 17340298250 重庆市奉节县诗仙西路137号" style="flex:1;min-width:0;padding:8px 10px;border:2px solid #ffe4f0;border-radius:10px;font-size:.8rem;outline:none;background:#fff" onkeydown="if(event.key==='Enter')parseAddr()">
        <button class="btn btn-outline" id="btnParseAddr" onclick="parseAddr()" style="white-space:nowrap">📍 解析</button>
      </div>
      <div style="margin-top:6px">
        <label style="display:flex;align-items:center;gap:4px;font-size:.72rem;color:#f472b6;margin-bottom:6px;cursor:pointer"><input type="checkbox" id="chkDefault" checked> 设为孔夫子<strong>默认</strong>收货地址</label>
        <button class="btn btn-primary" id="btnAddAddr" onclick="addAddrKFZ()" style="white-space:nowrap;display:none;width:100%;padding:9px 0">📦 添加到孔夫子收货地址</button>
      </div>
      <div id="addrResult" style="font-size:.75rem;color:#d48aa9;margin-top:5px"></div>
    </div>

  <div class="card">
    <div class="fold-header" onclick="fold('hist')">
      <div class="card-title" style="margin-bottom:0">📋 历史记录</div>
      <span class="arrow" id="histArrow">▶</span>
    </div>
    <div class="fold-body" id="fold_hist"><div id="histList" style="margin-top:4px"><div style="text-align:center;color:#c4b5d0;font-size:.8rem;padding:10px">暂无</div></div></div>
  </div>

  <div id="results"></div>
  <div id="empty" class="empty-state">📝 输入 ISBN 后点查最低价</div>

  <!-- Cookie 状态条 + 设置（移到页面最下面，不挡价格） -->
  <div id="cookieBar" onclick="fold('cookie')">
    <span id="cookIcon">🟢</span> <span id="cookText"></span> <span id="cookAct" style="font-size:.75rem;color:#9d8bb0;float:right">→</span>
  </div>

  <div class="card" style="border:1px solid #fde68a">
    <div class="fold-header" onclick="fold('cookie')">
      <div class="card-title" style="margin-bottom:0">🍪 Cookie 设置</div>
      <span><span id="cookDot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#c4b5d0;margin-right:4px"></span><span class="arrow" id="cookArrow">▶</span></span>
    </div>
    <div class="fold-body" id="fold_cookie">
      <div style="margin-top:6px;font-size:.8rem;color:#475569;line-height:1.6">
        <div id="cookSt" style="padding:6px 10px;border-radius:6px;background:#f8fafc;font-size:.78rem;border:1px solid #e2e8f0;margin-bottom:6px">检查中...</div>
        <details style="margin-bottom:6px;background:#eff6ff;border-radius:6px;padding:8px 10px;border:1px solid #bfdbfe;font-size:.75rem">
          <summary style="font-weight:600;color:#a855f7;cursor:pointer">📱 手机取 Cookie</summary>
          <div style="margin-top:6px;line-height:1.7">
            在手机浏览器打开 <strong>kongfz.com</strong> 并登录 → 地址栏输入 <code style="background:#e2e8f0;padding:1px 4px;border-radius:3px;word-break:break-all">javascript:prompt('',document.cookie)</code> → 复制弹窗内容
          </div>
        </details>
        <textarea id="cookInp" placeholder="粘贴 Cookie 字符串或 cURL 命令" style="width:100%;min-height:50px;font-family:monospace;font-size:.78rem"></textarea>
        <div class="row">
          <button class="btn btn-primary" onclick="saveCookie()" style="background:#f59e0b;font-size:.8rem">💾 保存</button>
          <span id="cookMsg" style="font-size:.8rem"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <button onclick="scrollTo(0,0)"><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg><span>顶部</span></button>
  <button onclick="showTrack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg><span>📦 快递</span></button>
  <button onclick="fold('cookie')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg><span>Cookie</span></button>
  <button onclick="fold('hist')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>历史</span></button>
  <button onclick="cleanupAddr()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg><span>清理地址</span></button>
  <button onclick="selfCheck()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg><span>自检</span></button>
</div>
<div class="toast" id="toast"></div>

<script>
var R=false,L=[],I=id('inputArea'),S=id('status'),E=id('results'),N=id('empty'),Q=id('btnQuery');
function id(s){return document.getElementById(s)}
function esc(s){return(s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function ss(t,c){S.textContent=t;S.className=c||''}
function fj(u,o){return fetch(u,o||{}).then(function(r){return r.json()})}

// 折叠
function fold(n){
  var b=id('fold_'+n),a=id(n+'Arrow');
  if(!b)return;
  b.classList.toggle('open');
  if(a)a.classList.toggle('open');
  if(b.classList.contains('open')&&n==='hist')loadH();
  if(b.classList.contains('open')&&n==='cookie')ckC();
}

// 从混排文字提取 ISBN（ISBN-13 + ISBN-10，校验位验证，处理粘连）
function chk13(s){
  if(!/^\d{13}$/.test(s))return false;
  var sum=0;
  for(var i=0;i<12;i++)sum+=(i%2?3:1)*(s.charCodeAt(i)-48);
  return (10-sum%10)%10===s.charCodeAt(12)-48;
}
function chk10(s){
  if(!/^\d{9}[\dX]$/.test(s))return false;
  var sum=0;
  for(var i=0;i<9;i++)sum+=(s.charCodeAt(i)-48)*(10-i);
  sum+=(s[9]==='X'?10:(s.charCodeAt(9)-48));
  return sum%11===0;
}
function extractISBNs(t){
  var is=[],v={};
  function add(s){if(!v[s]){v[s]=1;is.push(s)}}
  var c=t.replace(/[-\s]/g,''); // 去连字符空格：978-7-111-67966-0 → 9787111679660
  var re13=/(?:978|979|977)\d{10}/g,mm;
  while((mm=re13.exec(c))!==null){ if(chk13(mm[0])) add(mm[0]); }
  // 移除已识别 ISBN-13 后，剩余文本找 ISBN-10
  var rest=c.replace(/(?:978|979|977)\d{10}/g,'');
  var re10=/(^|[^\d])(\d{9}[\dX])(?!\d)/g,m2;
  while((m2=re10.exec(rest))!==null){ if(chk10(m2[2])) add(m2[2]); }
  return is;
}

// 按行切分书号：每行一个，校验通过的→查询，否则→搜索不到
function extractAll(t){
  var valid=[],bad=[],seen={};
  t.split(/\r?\n|[,，;；]/).forEach(function(seg){
    var c=seg.replace(/[-\s]/g,'');
    if(!c||c.length<8||c.length>13)return;
    if(seen[c])return;seen[c]=1;
    if((c.length===13&&chk13(c))||(c.length===10&&chk10(c)))valid.push(c);
    else bad.push(c);
  });
  return {valid:valid, invalid:bad};
}

// 粘贴
var pt;I.addEventListener('paste',function(){clearTimeout(pt);pt=setTimeout(function(){var ex=extractAll(I.value);if(!ex.valid.length&&!ex.invalid.length){ss('未识别到书号（每行一个）','error')}},150)});
I.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='Enter')Q.click()});
function cp(){var b=id('pc');if(b)b.remove();Q.click()}

// === 收货地址解析 ===
var _addrProvince='';  // 全局：解析出的省份
var _addrUserArea='';  // 全局：收货地区编码（cityId/provId，查价用 userArea）
var _addrInfo=null;    // 全局：官方解析出的完整地址信息
function parseAddr(){
  var val=(id('addrInput').value||'').trim();
  var res=id('addrResult');
  var btnAdd=id('btnAddAddr');
  if(!val){res.textContent='请先输入地址';res.style.color='#ef4444';return}
  res.textContent='⏳ 解析中...';res.style.color='#d48aa9';
  // 先本地简单解析省份（用于算运费）
  fetch('/api/parse_address?address='+encodeURIComponent(val))
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.province){
        _addrProvince=d.province;
        res.innerHTML='✅ 已识别省份：<strong>'+d.province+'</strong> · 查价将按该收货地址精确算真实运费（秒级）';
        res.style.color='#10b981';
      }else{
        _addrProvince='';
        res.textContent='⚠️ 未能识别省份，将使用默认运费';
        res.style.color='#f59e0b';
      }
      // 再调官方解析，拿完整信息用于添加地址
      fetch('/api/address/parse?address='+encodeURIComponent(val))
        .then(function(r2){return r2.json()})
        .then(function(d2){
          if(d2.success){
            _addrInfo=d2;
            _addrUserArea=d2.cityId||d2.provId||'';
            if(btnAdd)btnAdd.style.display='inline-block';
          }else{
            _addrInfo=null;
            _addrUserArea='';
            if(btnAdd)btnAdd.style.display='none';
          }
        })
        .catch(function(){_addrInfo=null;if(btnAdd)btnAdd.style.display='none'});
    })
    .catch(function(){res.textContent='❌ 解析失败';res.style.color='#ef4444'});
}

// 添加到孔夫子收货地址
function addAddrKFZ(){
  var btn=id('btnAddAddr');
  var res=id('addrResult');
  if(!_addrInfo){res.textContent='⚠️ 请先解析地址';res.style.color='#f59e0b';return}
  // 拼 area：重庆/直辖市用 cityId，普通省用 areaId||cityId||provId
  var area=_addrInfo.areaId||_addrInfo.cityId||_addrInfo.provId;
  if(!area){res.textContent='❌ 未解析到地区编码';res.style.color='#ef4444';return}
  var body={
    receiverName:_addrInfo.name||'',
    phoneNum:_addrInfo.mobile||'',
    mobile:'',
    area:String(area),
    address:_addrInfo.address||'',
    zipCode:_addrInfo.zipCode||'',

  };

// 报价规则：单本利润=max(22%进价,5元)；打包利润=max(22%合计,保底)，保底=n>=5?20:n==4?15:5*n，封顶30元
function singleSuggest(c){return Math.round((c+Math.max(0.22*c,5))*100)/100}
function pkgSuggest(T,n){var p=Math.max(0.22*T,n>=5?20:n===4?15:5*n);if(p>30)p=30;return Math.round((T+p)*100)/100}

      lines.push('   ISBN: '+r.isbn);

  }
  var label=forBuyer?'报价单已复制，可直接发给买家':'已复制成本报价单';
  doCopy(lines.join('\n'),function(){toast('✅ '+label)},function(){prompt('📋 '+(forBuyer?'报价单':'成本单')+'，复制后关闭：',lines.join('\n'))});

// 一键复制（弹窗内按钮）：成功即关闭弹窗 + 提示
function kfzCopy(txt,btn){
  var done=function(){
    btn.textContent='✅ 已复制';
    setTimeout(function(){
      var cm=document.getElementById('cm');if(cm)cm.remove();
      if(_copyToast)_copyToast();
    },400);
  };
  var fail=function(){toast('⚠️ 复制未成功，请长按上方文字后点「拷贝」')};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(fail);
  }else if(document.execCommand){
    // 降级：屏幕内可见 textarea + execCommand（iOS 对屏幕外元素会失败）
    var ta=document.createElement('textarea');
    ta.value=txt;
    ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:8px;left:8px;width:96vw;height:60px;font-size:12px;opacity:.01;z-index:2147483647';
    document.body.appendChild(ta);
    ta.focus();ta.select();ta.setSelectionRange(0,txt.length);
    var okFlag=false;
    try{okFlag=document.execCommand('copy')}catch(e){okFlag=false}
    document.body.removeChild(ta);
    if(okFlag)done();else fail();
  }else{fail()}
}

// 文本转清单图片（canvas 绘制，长按保存后发闲鱼，图片不受文字长度限制）
function txtToImage(txt,title){
  if(!txt){toast('无内容');return}
  var lines=txt.split('\n');
  var W=680,pad=28,lineH=32,headH=104,bottomH=36;
  // 用离屏 canvas 量宽度做自动换行
  var c0=document.createElement('canvas'),ctx0=c0.getContext('2d');
  ctx0.font='17px -apple-system,"PingFang SC",sans-serif';
  var max=W-pad*2,rows=[];
  lines.forEach(function(ln){
    if(!ln){rows.push('');return}
    if(ctx0.measureText(ln).width<=max){rows.push(ln);return}
    var cur='';
    for(var i=0;i<ln.length;i++){
      if(ctx0.measureText(cur+ln[i]).width>max){rows.push(cur);cur=ln[i]}
      else cur+=ln[i];
    }
    if(cur)rows.push(cur);
  });
  var H=bottomH+headH+rows.length*lineH;
  var c=document.createElement('canvas');
  c.width=W;c.height=H;
  var ctx=c.getContext('2d');
  // 白底
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  // 顶部渐变条
  var g=ctx.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'#f9a8d4');g.addColorStop(1,'#a855f7');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,10);
  // 标题
  ctx.fillStyle='#b0567f';
  ctx.font='bold 24px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText(title||'报价清单',pad,52);
  // 副标题：本数 + 字数
  ctx.fillStyle='#d48aa9';
  ctx.font='15px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('共 '+lines.length+' 本 · '+txt.length+' 字',pad,76);
  // 分割线
  ctx.strokeStyle='#ffe4f0';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad,92);ctx.lineTo(W-pad,92);ctx.stroke();
  // 内容行
  ctx.fillStyle='#3f3f46';
  ctx.font='17px -apple-system,"PingFang SC",sans-serif';
  var y=92+36;
  rows.forEach(function(r){ctx.fillText(r,pad,y);y+=lineH});
  showImgModal(c.toDataURL('image/png'));
}

  if(!last||isNaN(count)){localStorage.setItem(KEY,'1');localStorage.setItem(KEY+'_last',today);return 1}
  var yest=new Date(Date.now()-86400000).toISOString().slice(0,10);

    h += '<tr><td>查价</td><td>'+(aq.ok?'<span style="color:#10b981">✅</span>':'<span style="color:#ef4444">❌</span>')+'</td><td style="font-size:.75rem;color:#9d8bb0">'+esc(aq.detail||'')+'</td></tr>';
    h += '<tr><td>加购</td><td>'+(ac.ok?'<span style="color:#10b981">✅</span>':'<span style="color:#ef4444">❌</span>')+'</td><td style="font-size:.75rem;color:#9d8bb0">'+esc(ac.detail||'')+'</td></tr>';
    h += '</tbody></table></div>';

    h += '<div class="card"><div class="card-title">📄 关键文件</div><table><thead><tr><th>文件</th><th>修改时间</th><th>Hash</th></tr></thead><tbody>';
    var files = d.files||{};
    var fnames = Object.keys(files).sort();
    fnames.forEach(function(fn){
      var fi = files[fn];
      h += '<tr><td style="font-family:monospace;font-size:.72rem">'+esc(fn)+'</td><td>'+(fi.mtime||'-')+'</td><td style="font-family:monospace;font-size:.72rem;color:#9d8bb0">'+(fi.hash||'-')+'</td></tr>';
    });
    h += '</tbody></table></div>';

    if(btn){btn.disabled=0;btn.style.opacity='1'}
  }).catch(function(){
    el.innerHTML = '<div class="card">❌ 自检请求失败</div>';
    if(btn){btn.disabled=0;btn.style.opacity='1'}
  })
}

// 一键记账（不弹窗，自动用最低总价）


function loc(){location.reload()}

// === 快递查号 ===
function showTrack(){
  var cont=document.querySelector('.container');
  var h='<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><button onclick="loc()" style="padding:4px 10px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;font-size:.8rem;cursor:pointer">← 返回查价</button><strong style="font-size:.9rem">📦 快递查号</strong></div>';
  h+='<div class="card"><div class="card-title">📱 搜手机号查快递</div>';
  h+='<div style="display:flex;gap:8px"><input id="tkPhone" type="text" placeholder="粘贴买家收货信息自动识别手机号" oninput="tkPhoneAuto()" onkeydown="if(event.key==\'Enter\')tkSearch()" style="flex:1;padding:13px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:1rem;outline:none"><button id="tkBtn" onclick="tkSearch()" style="padding:13px 22px;border-radius:8px;border:none;background:#a855f7;color:#fff;font-weight:600;font-size:1rem;cursor:pointer">🔍 查询</button></div>';
  h+='<div id="tkHint" style="font-size:.78rem;color:#c4b5d0;margin-top:10px;line-height:1.5">直接粘贴买家收货信息（如「15996231420 栖霞区马群…」）自动识别手机号查订单</div>';
  h+='</div><div id="tkRes"></div>';
  cont.innerHTML=h;
  setTimeout(function(){id('tkPhone').focus()},100);
}

var _tkOrders=[],_tkPage=1,_tkPhone='';

// 粘贴/输入含手机号的文本时自动识别手机号并查询
function tkPhoneAuto(){
  var p=id('tkPhone');if(!p)return;
  var raw=p.value.trim();
  var m=raw.match(/1[3-9]\d{9}/);
  if(m&&raw!==m[0]){p.value=m[0];tkSearch()}
}

function tkSearch(page){
  var p=id('tkPhone'),btn=id('tkBtn');
  if(!p||!btn)return;
  var raw=p.value.trim();
  var m=raw.match(/1[3-9]\d{9}/);
  var phone=m?m[0]:raw;
  if(!phone||!/^1\d{10}$/.test(phone)){toast('未识别到手机号，请粘贴含手机号的信息');return}
  if(m&&raw!==phone)p.value=phone;
  if(page===undefined||page===null)page=1;
  btn.disabled=1;btn.textContent='⏳ 查询中...';
  _tkPhone=phone;_tkPage=page;
  var el=id('tkRes');if(!el)return;
  el.innerHTML='<div style="text-align:center;padding:20px;color:#c4b5d0">⏳ 查询中...</div>';

  fetch('/api/order/search?phone='+encodeURIComponent(phone)+'&page='+page)
    .then(function(r){return r.json()})
    .then(function(d){
      btn.disabled=0;btn.textContent='🔍 查询';
      if(d.error){el.innerHTML='<div style="color:#ef4444;text-align:center;padding:14px;background:#fef2f2;border-radius:8px">❌ '+d.error+'</div>';return}
      _tkOrders=d.orders||[];
      if(!_tkOrders.length){
        el.innerHTML='<div class="empty-state" style="padding:30px">📭 没有找到这个手机号的订单</div>';
        return;
      }
      renderTkOrders(el, d);
    })
    .catch(function(){
      btn.disabled=0;btn.textContent='🔍 查询';
      el.innerHTML='<div style="color:#ef4444;text-align:center;padding:14px;background:#fef2f2;border-radius:8px">❌ 网络错误</div>';
    });
}

function renderTkOrders(el, d){
  var orders=d.orders||[];
  var hasTrackCount=orders.filter(function(o){return o.shipment_num}).length;
  var h='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px"><span style="font-size:.78rem;color:#9d8bb0">共找到 <strong>'+d.total+'</strong> 条订单 · <strong>'+hasTrackCount+'</strong> 条有物流</span>';
  if(hasTrackCount){
    h+='<button onclick="copyAllTrack()" style="padding:7px 14px;border-radius:8px;border:none;background:#a855f7;color:#fff;font-weight:600;font-size:.8rem;cursor:pointer">📋 一键复制全部物流</button>';
  }
  h+='</div>';

  orders.forEach(function(o,i){
    var items=o.items||[];
    var hasTrack=o.shipment_num&&o.shipment_num.length>0;
    var st=trackStatus(o);

    h+='<div class="tk-order" id="tko_'+i+'" style="margin-bottom:10px;border:1px solid #ffe4f0;border-radius:14px;padding:12px 14px;background:#fff">';

    // 第一行：快递单号（左侧）+ 收件人（右侧）
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">';
    if(hasTrack){
      var tn = o.shipment_num||'';
      h+='<div style="flex:1;min-width:160px;line-height:1.4">';
      h+='<div style="font-family:monospace;font-size:.9rem;color:#f472b6;font-weight:700;word-break:break-all">📮 '+(o.shipping_company?o.shipping_company+' ':'')+tn+'</div>';
      h+='</div>';
    }else{
      h+='<div style="flex:1;min-width:160px;line-height:1.4"><span style="font-size:.85rem;color:#e0a8c2">📮 尚未发货</span></div>';
    }
    h+='<span style="font-size:.85rem;font-weight:600;color:#a9446f;white-space:nowrap;padding-top:2px">👤 '+(o.receiver_name||'收件人')+'</span>';
    h+='</div>';

    // 第二行：物流状态标签 + 复制按钮（间距拉开）
    h+='<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">';
    if(hasTrack){
      h+='<span style="font-size:.72rem;padding:3px 10px;border-radius:12px;color:#fff;background:'+st.cls+'">'+st.text+'</span>';
      h+='<span onclick="copyTrack('+i+')" style="padding:5px 12px;border-radius:8px;background:#f9a8d4;color:#fff;font-size:.75rem;cursor:pointer;font-weight:600">📋 复制物流</span>';
    }else{
      h+='<span style="font-size:.72rem;padding:3px 10px;border-radius:12px;color:#fff;background:#e0a8c2">未发货</span>';
    }
    h+='</div>';

    // 第三行：书籍（行间距拉开，长书名自动换行）
    if(items.length){
      h+='<div style="margin-top:12px;border-top:1px dashed #ffe4f0;padding-top:10px">';
      items.forEach(function(it){
        var isbn=it.isbn||'';
        h+='<div style="padding:5px 0;font-size:.84rem;line-height:1.5;word-break:break-all">';
        h+='<span style="color:#a9446f">📖 '+(it.name||'?')+'</span>';
        if(isbn)h+='<span style="color:#d48aa9;font-size:.72rem">  '+isbn+'</span>';
        h+='</div>';
      });
      h+='</div>';
    }

    h+='</div>';
  });

  var more=d.total>d.page*d.page_size;
  if(more){
    h+='<div style="text-align:center;margin:10px 0"><button onclick="tkSearch('+(_tkPage+1)+')" style="padding:8px 24px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:.85rem;cursor:pointer">📄 下一页</button></div>';
  }

  el.innerHTML=h;
}

function copyTkNum(tn){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(tn).then(function(){toast('✅ 已复制: '+tn)}).catch(function(){prompt('📋 复制快递单号：',tn)})
  }else{prompt('📋 复制快递单号：',tn)}
}

// 物流状态判断：未发货 / 已揽收 / 运输中 / 派送中 / 待领取 / 已签收
function trackStatus(o){
  if(!o.shipment_num) return {text:'未发货',cls:'#c4b5d0'};
  var lg=o.logistic||[];
  if(!lg.length) return {text:'在途',cls:'#a855f7'};
  var last=lg[lg.length-1];
  var s=(last.status||''),c=last.code;
  if(c===3||s.indexOf('签收')>=0) return {text:'已签收',cls:'#10b981'};
  if(c===412||s.indexOf('待取')>=0||s.indexOf('超时')>=0||s.indexOf('暂存')>=0||s.indexOf('驿站')>=0) return {text:'待领取',cls:'#f59e0b'};
  if(c===5||s.indexOf('派送')>=0) return {text:'派送中',cls:'#f59e0b'};
  if(c===1||s.indexOf('揽收')>=0) return {text:'已揽收',cls:'#a855f7'};
  if(c===0||s.indexOf('运输')>=0||s.indexOf('转运')>=0) return {text:'运输中',cls:'#a855f7'};
  return {text:'在途',cls:'#a855f7'};
}

// 一键复制单条物流：公司 + 单号 + 状态
function copyTrack(i){
  var o=_tkOrders[i];
  if(!o)return;
  var st=trackStatus(o);
  var txt='物流：'+(o.shipping_company||'')+'\n单号：'+(o.shipment_num||'')+'\n状态：'+st.text;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast('✅ 已复制物流信息')}).catch(function(){prompt('📋 复制物流信息：',txt)})
  }else{prompt('📋 复制物流信息：',txt)}
}

// 一键复制全部物流：汇总所有有单号的订单，只含 包裹总数/快递公司/单号/书号书名
function copyAllTrack(){
  var has=_tkOrders.filter(function(o){return o.shipment_num});
  if(!has.length){toast('无物流可复制');return}
  var lines=['共 '+has.length+' 个包裹',''];
  has.forEach(function(o,i){
    lines.push('📦 包裹'+(i+1)+' | '+(o.shipping_company||'快递')+' | '+o.shipment_num);
    var items=o.items||[];
    if(items.length){
      items.forEach(function(it){
        var isbn=it.isbn||'';
        lines.push((isbn?isbn+' ':'')+(it.name||'?'));
      });
    }else{
      lines.push('(无书籍信息)');
    }
    lines.push('');
  });
  var txt=lines.join('\n').replace(/\n\n$/, '\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast('✅ 已复制 '+has.length+' 个物流')}).catch(function(){prompt('📋 物流汇总：',txt)})
  }else{prompt('📋 物流汇总：',txt)}
}

function foldTk(i){
  var b=id('tkb_'+i);
  if(!b)return;
  b.style.maxHeight=b.style.maxHeight==='none'?'0px':'none';
  b.style.overflow=b.style.overflow==='visible'?'hidden':'visible';
  b.style.padding=b.style.padding==='10px 12px'?'0 12px':'10px 12px';
}
